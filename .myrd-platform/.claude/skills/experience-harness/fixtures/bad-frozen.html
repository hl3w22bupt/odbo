<!DOCTYPE html>
<!-- bad-frozen：渲染一次后冻结 —— 有 canvas、首帧有画面（色数 >1），但主循环从未启动（idle 帧差 0）。
     与 bad-static 的区分点：canvasPresent=true；与 good-canvas 的区分点：idle 帧差 0。 -->
<html lang="zh">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>bad-frozen</title>
<style>html,body{margin:0;background:#111;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
canvas.width = 390; canvas.height = 844;
const ctx = canvas.getContext('2d');
// 画一帧就停：模拟「引擎挂了/主循环没起」的黑屏近亲
const g = ctx.createLinearGradient(0, 0, 0, 844);
g.addColorStop(0, '#1a1a2e'); g.addColorStop(1, '#16213e');
ctx.fillStyle = g; ctx.fillRect(0, 0, 390, 844);
ctx.fillStyle = '#e94560'; ctx.fillRect(150, 380, 90, 90);
ctx.fillStyle = '#fff'; ctx.font = 'bold 24px sans-serif';
ctx.fillText('FROZEN', 140, 500);
// 故意不再 requestAnimationFrame
</script>
</body>
</html>
