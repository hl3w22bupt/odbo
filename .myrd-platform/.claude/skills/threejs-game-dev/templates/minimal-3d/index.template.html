<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>星尘收集 · GEM RUSH（threejs-game-dev 最小模板）</title>
<style>
  :root {
    --panel: rgba(8, 16, 20, 0.62);
    --line: rgba(96, 202, 224, 0.55);
    --text: #e8f4f6;
    --accent: #ffb057;
    --font-num: "DIN Alternate", "Bahnschrift", "Arial Narrow", ui-sans-serif, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 触屏兜底：禁浏览器手势（滚动/双击缩放/长按菜单）—— touchstart 立即可交互，消除 300ms 延迟（E-04） */
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1014;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; color: var(--text); font-family: var(--font-num); }
  .hidden { display: none !important; }

  #hud { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
    align-items: center; padding: 14px 18px; font-size: 22px; letter-spacing: 1px; }
  #hud .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 14px; }
  #btn-pause { pointer-events: auto; width: 44px; height: 44px; min-width: 44px; min-height: 44px; /* 热区 ≥44px */
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--text);
    font-size: 18px; font-family: inherit; }

  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center; text-align: center; background: rgba(6, 10, 14, 0.45); }
  .screen h1 { font-size: 34px; letter-spacing: 4px; text-shadow: 0 0 18px rgba(96, 202, 224, 0.8); }
  .screen p { color: rgba(232, 244, 246, 0.75); font-size: 15px; }
  .screen .cta { color: var(--accent); font-size: 18px; margin-top: 8px; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  #ts-smoke { position: absolute; left: -9999px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="hud" class="hidden">
    <span class="chip">得分 <span id="score">0</span></span>
    <span class="chip">时间 <span id="time">60</span>s</span>
    <button id="btn-pause" aria-label="暂停">Ⅱ</button>
  </div>
  <div id="screen-title" class="screen">
    <h1>星尘收集 · GEM RUSH</h1>
    <p>WASD / 方向键移动 · 收集全部宝石 · 空格暂停 · R 重开</p>
    <p>触屏：左半屏摇杆移动 · 右半屏点按确认</p>
    <p class="cta">按 回车 / 点按右侧 开始</p>
  </div>
  <div id="screen-paused" class="screen hidden">
    <h1>已暂停</h1>
    <p class="cta">按 空格 / 点按右侧 继续</p>
  </div>
  <div id="screen-over" class="screen hidden">
    <h1 id="over-title">时间到</h1>
    <p id="over-detail"></p>
    <p class="cta">按 回车 / 点按右侧 再来一局</p>
  </div>
  <div id="ts-smoke"></div>
</div>
<script><!--BUNDLE--></script>
</body>
</html>
