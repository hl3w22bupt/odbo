# 《星光练习生：才艺养成物语》(talent-nurture) AppHost 应用清单（平台构建管线步骤 1 读取；M1 仅支持顶层字符串键值）
# 壳位于仓库根：server/ 内是 Node20 + Hono 应用；游戏为纯 Web 静态产物（零外部二进制资产）
name = "talent-nurture"
runtime = "node20"
health = "/health"

# 底座 A：资产出 bundle（部署时平台把该目录上传对象存储，server 用 asset-store 懒加载）
assets_dir = "games/talent-nurture/export/web"
