# iii engine configuration
# Docs: https://iii.dev/docs/how-to/configure-engine
workers:
  - name: iii-http
    # 'iii-http': value now lives in the configuration worker at ./data/configuration/iii-http.yaml. Edit at runtime via 'iii config set iii-http' (or 'configuration::set'); this block is no longer read.

  - name: iii-observability
    # 'iii-observability': value now lives in the configuration worker at ./data/configuration/iii-observability.yaml. Edit at runtime via 'iii config set iii-observability' (or 'configuration::set'); this block is no longer read.

  - name: iii-worker-manager
    config:
      port: 49144

  - name: queue
    # 'queue': value now lives in the configuration worker at ./data/configuration/queue.yaml. Edit at runtime via 'iii config set queue' (or 'configuration::set'); this block is no longer read.
